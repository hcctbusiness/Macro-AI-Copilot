[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-ai-copilot"
version = "0.2.0"
description = "Macro regime detection, walk-forward machine learning and multi-asset allocation, built on QuantCore."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harry CHU", email = "257962672+hcctbusiness@users.noreply.github.com" }]
maintainers = [{ name = "HCCT Group" }]
keywords = ["macro", "regimes", "machine-learning", "asset-allocation", "quant"]
dependencies = [
    "quantcore[data] @ git+https://github.com/hcctbusiness/QuantCore.git",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hcctbusiness/Macro-AI-Copilot"
Engine = "https://github.com/hcctbusiness/QuantCore"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
